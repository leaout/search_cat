name: Build Windows Executable

on:
  push:
    branches:
      - main  # 每次推送到main分支时构建
    tags:
      - 'v*'  # 也支持打tag构建

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Create virtual environment
      run: |
        python -m venv .venv
        .\.venv\Scripts\python.exe -m pip install --upgrade pip

    - name: Install dependencies
      run: |
        .\.venv\Scripts\pip.exe install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple
        .\.venv\Scripts\pip.exe install pyinstaller

    - name: Remove obsolete typing package
      run: |
        .\.venv\Scripts\pip.exe uninstall -y typing || echo "typing not installed"

    - name: Build with PyInstaller
      run: |
        .\.venv\Scripts\python.exe -m PyInstaller gui.spec --noconfirm

    - name: Check build output
      run: |
        if (Test-Path dist/gui/gui.exe) {
            Write-Host "Build successful: gui.exe found"
            Get-ChildItem dist/gui/
        } else {
            Write-Host "Build failed: gui.exe not found"
            Get-ChildItem dist/ -Recurse
            exit 1
        }

    - name: Package artifacts
      run: |
        if (Test-Path gui.zip) { Remove-Item gui.zip -Force }
        Compress-Archive -Path dist/gui\* -DestinationPath SearchCat.zip -Force

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SearchCat
        path: SearchCat.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: SearchCat.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
